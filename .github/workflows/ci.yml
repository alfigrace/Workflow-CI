name: Machine Learning CI Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  ml_ci_pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Harus pas namanya dengan checklist sistem
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      # 2. Menyiapkan Python versi kamu
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      # 3. Check Env
      - name: Check Env
        run: |
          python --version
          pip --version

      # 4. Install dependencies utama
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn mlflow

      # 5. Set MLflow Tracking URI (Kita arahkan lokal ke mlruns)
      - name: Set MLflow Tracking URI
        run: |
          echo "MLFLOW_TRACKING_URI=mlruns" >> $GITHUB_ENV

      # 6. Run mlflow project
      - name: Run mlflow project
        run: |
          mlflow run . --no-conda

      # 7. Install Python dependencies (Kebutuhan post-run)
      - name: Install Python dependencies
        run: |
          pip install mlflow

      # 8. Upload to GitHub (Sesuai catatan dispensasi penyimpanan yang kamu pilih)
      - name: Upload to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: mlruns/